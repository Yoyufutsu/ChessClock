<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Dual Timer (Lap on stopped side)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      background: #fff;
      color: #111;
    }

    .container {
      display: flex;
      height: 100%;
      position: relative;
    }

    .panel {
      flex: 1;
      position: relative;               /* for absolute children */
      cursor: pointer;
      user-select: none;
      background-color: #f7f7f7;
      border: 1px solid #ddd;
      transition: opacity 0.2s ease, filter 0.2s ease;
      overflow: hidden;
    }

    .panel.inactive {
      opacity: 0.55;
      filter: brightness(0.9);
    }

    .right {
      background-color: #f2f2f2;
    }

    /* Center display (timer + message) is fixed vertically so laps don't push it */
    .display-center {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none; /* clicks go to panel */
    }

    .time {
      font-size: 3.6rem;
      line-height: 1;
      font-weight: 600;
      pointer-events: none;
    }

    .message {
      margin-top: 0.4rem;
      font-size: 1rem;
      color: #d33;
      height: 1.2em;
      pointer-events: none;
    }

    /* Laps area fixed near bottom; adding items won't move the center display */
    .laps {
      position: absolute;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      width: 90%;
      max-height: 38%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      align-items: flex-start;
      padding-right: 6px; /* room for scrollbar */
      box-sizing: border-box;
      pointer-events: auto;
    }

    .lap {
      font-size: 0.9rem;   /* 小さく */
      color: #666;         /* 薄く */
      opacity: 0.85;
      line-height: 1;
      white-space: nowrap;
    }

    .center {
      width: 220px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
      background: rgba(255,255,255,0.9);
      padding: 0.6rem;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    button {
      font-size: 1.05rem;
      padding: 0.6em 1.2em;
      cursor: pointer;
      width: 160px;
    }

    /* thin scrollbar */
    .laps::-webkit-scrollbar { height: 6px; width: 8px; }
    .laps::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
    .laps::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel" id="leftTimer" title="左パネルをクリックで交代">
      <div class="display-center">
        <div class="time" id="leftTime">0.00</div>
        <div class="message" id="leftMsg"></div>
      </div>
      <div class="laps" id="leftLaps" aria-label="左のラップタイム一覧"></div>
    </div>

    <div class="panel right" id="rightTimer" title="右パネルをクリックで交代">
      <div class="display-center">
        <div class="time" id="rightTime">0.00</div>
        <div class="message" id="rightMsg"></div>
      </div>
      <div class="laps" id="rightLaps" aria-label="右のラップタイム一覧"></div>
    </div>

    <div class="center">
      <button id="toggleButton">スタート</button>
    </div>
  </div>

  <script>
    // constants
    const LEFT = 0;
    const RIGHT = 1;
    const INTERVAL = 10; // ms (0.01s)

    // state
    let currentSide = null;   // LEFT or RIGHT
    let timerId = null;       // interval id when running
    let paused = true;        // whether paused

    // default values (in seconds)
    let initialTime = 10.0;
    let zeroTime = 5.0;

    let times = {
      [LEFT]: 0,
      [RIGHT]: 0
    };

    // false: initial-timer mode, true: zero-mode (after initial reached)
    let isZeroMode = {
      [LEFT]: false,
      [RIGHT]: false
    };

    // preserveOnResume: when user pauses explicitly, keep remaining time for zero-mode
    let preserveOnResume = {
      [LEFT]: false,
      [RIGHT]: false
    };

    // lap arrays
    let laps = {
      [LEFT]: [],
      [RIGHT]: []
    };

    // start timestamps for current turn (for lap measurement)
    let sideStartTime = {
      [LEFT]: null,
      [RIGHT]: null
    };

    // DOM refs
    const panels = {
      [LEFT]: document.getElementById("leftTimer"),
      [RIGHT]: document.getElementById("rightTimer")
    };
    const timeEls = {
      [LEFT]: document.getElementById("leftTime"),
      [RIGHT]: document.getElementById("rightTime")
    };
    const msgEls = {
      [LEFT]: document.getElementById("leftMsg"),
      [RIGHT]: document.getElementById("rightMsg")
    };
    const lapsEls = {
      [LEFT]: document.getElementById("leftLaps"),
      [RIGHT]: document.getElementById("rightLaps")
    };
    const toggleButton = document.getElementById("toggleButton");

    // ask user for configuration on load
    // initialTime: minutes input -> convert to seconds
    // zeroTime: seconds input
    function askConfig() {
      const initMin = parseFloat(prompt(
        "初期カウントダウン時間を分単位で入力してください",
        "2"
      ));
      const zeroSec = parseFloat(prompt(
        "0到達後に使う時間を秒単位で入力してください",
        "10"
      ));

      if (!isNaN(initMin) && initMin > 0) initialTime = initMin * 60;
      if (!isNaN(zeroSec) && zeroSec >= 0) zeroTime = zeroSec;

      times[LEFT] = initialTime;
      times[RIGHT] = initialTime;
    }

    function render() {
      timeEls[LEFT].textContent = times[LEFT].toFixed(2);
      timeEls[RIGHT].textContent = times[RIGHT].toFixed(2);

      // darken panels that are not active or when stopped (timerId === null)
      panels[LEFT].classList.toggle("inactive", currentSide !== LEFT || timerId === null);
      panels[RIGHT].classList.toggle("inactive", currentSide !== RIGHT || timerId === null);

      toggleButton.textContent = timerId !== null ? "一時停止" : "スタート";
    }

    function clearMessages() {
      msgEls[LEFT].textContent = "";
      msgEls[RIGHT].textContent = "";
    }

    function addLapToDOM(side, label) {
      const el = document.createElement("div");
      el.className = "lap";
      el.textContent = label;
      lapsEls[side].appendChild(el);
      // newest at bottom; auto-scroll so latest lap is visible
      lapsEls[side].scrollTop = lapsEls[side].scrollHeight;
    }

    // Stop the interval.
    // byUser indicates whether this stop was caused by the user pressing the toggle button.
    function stopCountdown(setPaused = true, byUser = false) {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      paused = setPaused;

      if (currentSide !== null) {
        if (byUser) {
          preserveOnResume[currentSide] = true; // preserve remaining for resume
        } else {
          preserveOnResume[currentSide] = false;
        }
      }

      render();
    }

    // start countdown on given side
    function startCountdown(side) {
      currentSide = side;
      paused = false;

      // clear any message
      msgEls[side].textContent = "";

      // zero-mode behavior: keep remaining only if preserveOnResume is true and times>0
      if (isZeroMode[side]) {
        if (!(preserveOnResume[side] && times[side] > 0)) {
          times[side] = zeroTime;
        }
      }

      // record start timestamp for lap measurement
      sideStartTime[side] = performance.now();

      render();

      if (timerId !== null) return; // already running

      timerId = setInterval(() => {
        times[side] -= INTERVAL / 1000;

        if (times[side] <= 0) {
          times[side] = 0;
          clearInterval(timerId);
          timerId = null;

          // automatic stop: do not preserve zero-mode remaining time
          preserveOnResume[side] = false;

          if (!isZeroMode[side]) {
            // initial timer reached 0 -> enter zero-mode
            isZeroMode[side] = true;

            if (zeroTime > 0) {
              // start zero-mode fresh (reset to zeroTime)
              times[side] = zeroTime;
              startCountdown(side); // will reset sideStartTime for zero-mode lap measurement
            } else {
              // zeroTime == 0 -> immediate auto-stop with message
              msgEls[side].textContent = "0秒に到達しました";
              paused = true;
              render();
            }
          } else {
            // already in zero-mode and it reached 0 -> show message and pause (automatic)
            msgEls[side].textContent = "0秒に到達しました";
            paused = true;
            render();
          }
          return;
        }

        render();
      }, INTERVAL);
    }

    // When switching side, record lap for the side that just stopped
    function recordLapAndSwitch() {
      const prev = currentSide;
      if (prev === null) {
        // nothing to record; just start next
        switchSideInternal();
        return;
      }

      // compute lap elapsed in seconds since start of this run (from sideStartTime[prev])
      let elapsed = 0;
      if (sideStartTime[prev] !== null) {
        elapsed = (performance.now() - sideStartTime[prev]) / 1000;
      } else {
        elapsed = 0;
      }

      // format elapsed with 2 decimal places
      const label = `Lap ${laps[prev].length + 1}: ${elapsed.toFixed(2)} s`;

      // Append lap under the side that was just stopped (prev), per request.
      laps[prev].push(label);
      addLapToDOM(prev, label);

      // Clear previous side start timestamp (end of run)
      sideStartTime[prev] = null;

      // finally start the next side
      switchSideInternal();
    }

    function switchSideInternal() {
      const next = currentSide === LEFT ? RIGHT : LEFT;
      startCountdown(next);
    }

    function switchSide() {
      recordLapAndSwitch();
    }

    // handle "stop" from user/key/click that causes immediate switch to other side
    // This stop is treated as NOT a user "pause" for preservation purposes (so byUser=false).
    function handleStop(side) {
      if (timerId === null) return;
      if (currentSide !== side) return;

      stopCountdown(false, false);
      switchSide();
    }

    // Toggle button behavior:
    // - If running -> treat as user pause: stopCountdown(setPaused=true, byUser=true)
    // - Else if paused and currentSide exists -> resume that side
    // - Else -> fresh start (initialize and start left)
    toggleButton.addEventListener("click", () => {
      if (timerId !== null) {
        // running -> pause by user (preserve remaining times, including zero-mode)
        stopCountdown(true, true);
        return;
      }

      // not running
      if (paused && currentSide !== null) {
        // resume same side
        startCountdown(currentSide);
        return;
      }

      // fresh start
      stopCountdown(false, false);
      times[LEFT] = initialTime;
      times[RIGHT] = initialTime;
      isZeroMode[LEFT] = false;
      isZeroMode[RIGHT] = false;
      preserveOnResume[LEFT] = false;
      preserveOnResume[RIGHT] = false;
      laps[LEFT] = [];
      laps[RIGHT] = [];
      lapsEls[LEFT].innerHTML = "";
      lapsEls[RIGHT].innerHTML = "";
      clearMessages();
      startCountdown(LEFT);
    });

    // key and click handlers for switching the active side
    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "a") handleStop(LEFT);
      if (e.key.toLowerCase() === "l") handleStop(RIGHT);
    });
    panels[LEFT].addEventListener("click", () => handleStop(LEFT));
    panels[RIGHT].addEventListener("click", () => handleStop(RIGHT));

    // initial config and render
    askConfig();
    currentSide = null;
    render();
  </script>
</body>
</html>
